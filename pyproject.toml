[project]
name = "loom"
version = "0.1.0"
description = "Autonomous software development team built on LangGraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Loom Team"}
]
keywords = ["langchain", "langgraph", "agents", "llm", "ai", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-anthropic>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-ollama>=0.2.0,<0.3.0",
    "langgraph>=0.2.0,<0.3.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "typer>=0.12.0,<0.13.0",
    "click>=8.0.0,<8.2.0",  # Pin to avoid typer compatibility issues
    "rich>=13.8.0,<14.0.0",
    "textual>=0.83.0,<1.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "websockets>=13.1,<14.0",
    "structlog>=24.4.0,<25.0.0",
    "docker>=7.1.0,<8.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "prompt_toolkit>=3.0.0,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "respx>=0.21.0,<0.22.0",
    "freezegun>=1.5.0,<2.0.0",
    "hypothesis>=6.100.0,<7.0.0",
]
search = [
    "tavily-python>=0.5.0,<1.0.0",
]
tracing = [
    "langsmith>=0.1.0,<1.0.0",
]
memory = [
    "lancedb>=0.6.0,<1.0.0",
    "sentence-transformers>=2.6.0,<3.0.0",
    "pyarrow>=15.0.0,<16.0.0",
]

[project.scripts]
loom = "loom.cli.app:app"

[project.urls]
Homepage = "https://github.com/rihaans/Loom"
Documentation = "https://github.com/rihaans/Loom#readme"
Repository = "https://github.com/rihaans/Loom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
# These box-drawing / angle glyphs are intentional UI design elements in the
# chat renderer, not typos — allow them past the ambiguous-unicode check.
allowed-confusables = ["❯", "›", "▸", "·", "▚", "◇"]

[tool.ruff.lint.per-file-ignores]
# CLI exit handlers show a friendly error message and then raise typer.Exit
# to terminate the process. The original exception's traceback is not surfaced
# to the user, so `raise ... from e` chaining adds noise without value.
"src/loom/cli/app.py" = ["B904"]
# Typer requires Argument/Option calls in function defaults — that's the API.
"src/loom/cli/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["loom"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Only collect test modules from the tests/ tree. This prevents pytest from
# trying to collect Pydantic models named TestCase/TestReport in src/loom/state/models.py.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "e2e: marks tests as end-to-end (requires real LLM)",
    "docker: marks tests that require Docker",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Pydantic model names happen to start with Test* (TestCase, TestReport);
    # pytest tries to collect them and warns. They're domain models, not tests.
    "ignore:cannot collect test class.*has a __init__ constructor:pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["src/loom"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
