name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Install package for mypy
        run: pip install -e .

      - name: Run mypy
        run: mypy src/loom

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --cov=loom --cov-report=xml

      - name: Run integration tests
        run: pytest tests/integration -v

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      # Without a built frontend the wheel must still build - the dashboard
      # is bundled conditionally.
      - name: Build wheel and sdist (no dashboard)
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard
        working-directory: frontend
        run: npm ci && npm run build

      - name: Rebuild wheel with dashboard bundled
        run: rm -rf dist && python -m build --wheel

      # Regression guard: an unanchored .gitignore pattern once excluded the
      # whole `src/loom/output` package from the wheel, producing an artifact
      # that could not import.
      - name: Verify every source package is in the wheel
        run: |
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          src = pathlib.Path("src/loom")
          missing = [
              p.name
              for p in sorted(src.iterdir())
              if p.is_dir()
              and p.name != "__pycache__"
              and (p / "__init__.py").is_file()
              and f"loom/{p.name}/__init__.py" not in names
          ]
          if missing:
              sys.exit(
                  "packages missing from wheel: "
                  + ", ".join(missing)
                  + " (check .gitignore for an unanchored pattern)"
              )
          print(f"all {len(names)} entries present; no package missing")
          EOF

      - name: Smoke-test the installed package
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls dist/*.whl)"
          /tmp/smoke/bin/loom version
          /tmp/smoke/bin/loom doctor || true

      - name: Verify the dashboard is inside the wheel
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("loom/dashboard/index.html") for n in names):
              sys.exit("dashboard missing from wheel")
          print(f"dashboard bundled in {wheel}")
          EOF

  test-sandbox:
    name: Test Sandbox (Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'test-docker')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sandbox image
        run: docker build -f docker/sandbox.Dockerfile -t loom-sandbox:latest .

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run sandbox tests
        run: pytest tests/integration -v -m docker

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[e2e]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_E2E: "1"
        run: pytest tests/e2e -v -m e2e
