name: Bug report
description: Something behaved differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The `loom doctor` output below usually explains
        half of these, so please don't skip it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I ran `loom build "a todo API"` and ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `loom doctor`
      render: shell
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: "anthropic:claude-sonnet-5 / ollama:llama3.1:8b"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Full error output
      render: shell

  - type: checkboxes
    id: sandbox
    attributes:
      label: Sandbox
      options:
        - label: Docker was available and `loom sandbox build` had been run
        - label: I understand results are marked unverified without a sandbox
